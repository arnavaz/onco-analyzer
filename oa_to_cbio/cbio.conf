# Configuration file for cBioPortal CNA thresholds
# Ratios are multipliers applied to the tumor's calculated ploidy

# High level amplification (cBioPortal CN = 2)
# Adjusted to driver definition (CN > 3 x ploidy)
AMP_RATIO=3.0

# Gain (cBioPortal CN = 1)
# Adjusted to gain threshold (CN > 2 x ploidy)
GAIN_RATIO=2.0

# Heterozygous / single-copy deletion (cBioPortal CN = -1)
# NOTE: In updated pipelines, het deletion uses minMinorAlleleCopyNumber < 0.5 directly
HET_DEL_RATIO=0.5

# Homozygous / deep deletion (cBioPortal CN = -2)
# Adjusted to absolute deletion threshold (minCopyNumber < 0.5)
HOM_DEL_ABS=0.5

# Offline GTF file path (optional)
# Used to plot gene body tracks (exons/introns) when execution node lacks internet access.
# If commented out or empty, the pipeline will query Ensembl REST API online.
GTF_FILE="/cluster/projects/pughlab/references/gencode/GRCh38/gencode.v31.annotation.gtf.gz"
